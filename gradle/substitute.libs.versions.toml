[versions]
commons-compress = "1.26.0"
commons-io = "2.14.0"
commons-lang3 = "3.18.0"
guava = "32.0.1-jre"
log4j = "2.12.4"
netty-common = "4.1.118.Final"
netty-handler = "4.1.118.Final"

[libraries]
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
netty-common = { module = "io.netty:netty-common", version.ref = "netty-common" }
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty-handler" }

[bundles]
loom = [ "log4j-core" ]
minecraft = [
    "commons-compress",
    "commons-lang3",
    "commons-io",
    "guava",
    "netty-common",
    "netty-handler",
]
